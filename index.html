<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Robot Workshop - Collect & Copy</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f7; padding: 20px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 500px; margin-bottom: 30px; }
        h1 { color: #4a90e2; text-align: center; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        p.subtitle { text-align: center; color: #666; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; cursor: pointer; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; transition: 0.3s; }
        input:focus { border-color: #4a90e2; outline: none; }
        button#submitBtn { width: 100%; padding: 15px; background: #4a90e2; color: white; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; transition: 0.3s; margin-top: 10px; font-weight: bold; }
        button#submitBtn:hover { background: #357abd; }
        button#submitBtn:disabled { background: #ccc; cursor: not-allowed; }
        
        /* พื้นที่แสดงผล Result Area */
        #result-area { margin-top: 25px; display: none; padding: 20px; background: #f8fafc; border-radius: 15px; border: 1px solid #e2e8f0; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .prompt-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .prompt-label { font-weight: bold; color: #2ecc71; font-size: 18px; }
        .prompt-box { background: #fff; padding: 15px; border-radius: 10px; border-left: 5px solid #2ecc71; word-wrap: break-word; font-family: 'Courier New', Courier, monospace; font-size: 14px; color: #444; line-height: 1.5; border: 1px solid #ddd; }
        .copy-info-bar { margin-top: 15px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .copy-btn { background: #2ecc71; color: white; padding: 10px 20px; border-radius: 8px; font-size: 14px; cursor: pointer; border: none; font-weight: bold; transition: 0.2s; }
        .copy-btn:hover { background: #27ae60; }
        .copy-info-text { font-size: 12px; color: #666; font-style: italic; }

        /* ข้อความแจ้งสถานะ */
        #status { text-align: center; margin-top: 15px; font-weight: bold; display: none; padding: 10px; border-radius: 8px; }
        .loading { background-color: #fef3c7; color: #b45309; }
        .success { background-color: #d1fae5; color: #065f46; }
        .error { background-color: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

<div class="container">
    <h1>🤖 Robot Workshop</h1>
    <p class="subtitle">Enter details to save your robot & get your prompt!</p>

    <form id="robotForm" onsubmit="return false;">
        <div class="input-group">
            <label for="robotName">1. Robot Name</label>
            <input type="text" id="robotName" placeholder="e.g., HBB-01" required>
        </div>
        <div class="input-group">
            <label for="ability">2. Ability / Skills</label>
            <input type="text" id="ability" placeholder="e.g., Teaching math, Solving puzzles" required>
        </div>
        <div class="input-group">
            <label for="identity">3. Identity / Personality</label>
            <input type="text" id="identity" placeholder="e.g., Kind, Creative, Helpful" required>
        </div>
        <div class="input-group">
            <label for="rule">4. Robot Rules</label>
            <input type="text" id="rule" placeholder="e.g., Explain step-by-step, Never tell a lie" required>
        </div>
        <div class="input-group">
            <label for="helpWorld">5. Mission (Help World)</label>
            <input type="text" id="helpWorld" placeholder="e.g., Make learning fun for everyone" required>
        </div>

        <button id="submitBtn" onclick="submitAndShowPrompt()">Save Data & Get Prompt! ✨</button>
    </form>

    <div id="status"></div>

    <div id="result-area">
        <div class="prompt-title-row">
            <span class="prompt-label">Your Card Prompt:</span>
        </div>
        <div class="prompt-box" id="finalPrompt"></div>
        
        <div class="copy-info-bar">
            <button class="copy-btn" onclick="copyPrompt()">Copy to Clipboard 📋</button>
            <p class="copy-info-text">Copy this text and paste it into your AI Image Generator (like DALL-E 3 or Midjourney V6).</p>
        </div>
    </div>
</div>

<script>
    // *** สำคัญ: วาง URL ที่ได้จาก Google Apps Script ตรงนี้ ***
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwKBsXE58mS91kc2v-AjjY4J_pUTIJOdzCAn3odTkxmes2B5obrLQpckITaIFBomdh4Eg/exec";

    async function submitAndShowPrompt() {
        const form = document.getElementById('robotForm');
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('status');
        const resultArea = document.getElementById('result-area');
        const finalPromptBox = document.getElementById('finalPrompt');

        // ตรวจสอบความครบถ้วน
        if (!form.checkValidity()) {
            form.reportValidity();
            return;
        }

        const data = {
            name: document.getElementById('robotName').value,
            ability: document.getElementById('ability').value,
            identity: document.getElementById('identity').value,
            rule: document.getElementById('rule').value,
            helpWorld: document.getElementById('helpWorld').value
        };

        // สร้าง Full Prompt
        data.fullPrompt = `A high-quality vertical trading card design of a robot named ${data.name}. The robot has a ${data.identity} personality and appearance. It features a sleek, futuristic body with ${data.ability} integrated into its design. The card includes a decorative header with the name, and a "Skills & Mission" section at the bottom listing: ${data.ability}, ${data.rule}, and its mission to ${data.helpWorld}. Style: Vibrant 3D cartoon, Pixar-inspired, soft cinematic lighting, colorful holographic borders, clean UI elements, 8k resolution, detailed background matching the robot's theme.`;

        // 1. จัดการ UI
        btn.disabled = true;
        status.style.display = 'block';
        status.className = 'loading';
        status.innerText = "Saving your data to Google Sheets... 🚀";
        resultArea.style.display = 'none';

        // 2. ส่งข้อมูลลง Google Sheet
        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        }).catch(err => console.error("Sheets Error:", err));

        // 3. แสดง Prompt บนหน้าเว็บทันที
        setTimeout(() => {
            finalPromptBox.innerText = data.fullPrompt;
            resultArea.style.display = 'block';
            status.className = 'success';
            status.innerText = "✅ Data saved and your prompt is ready!";
            btn.innerText = "Generate Another Card?";
            btn.disabled = false;
            btn.setAttribute("onclick", "location.reload()");
            
            // เลื่อนหน้าจอลงมาที่ผลลัพธ์
            resultArea.scrollIntoView({ behavior: 'smooth' });
        }, 1500);
    }

    // ฟังก์ชันก๊อปปี้
    function copyPrompt() {
        const promptText = document.getElementById('finalPrompt').innerText;
        navigator.clipboard.writeText(promptText).then(() => {
            alert("Prompt copied to clipboard! You can now paste it into the AI.");
        }).catch(err => {
            console.error('Failed to copy: ', err);
            alert("Oops! Auto-copy failed. Please select the text and copy it manually.");
        });
    }
</script>

</body>
</html>
